services:
  - type: web
    name: n8n
    runtime: docker
    repo: https://github.com/md-anas-ali/n8n.git
    branch: main

    plan: free
    region: virginia

    dockerfilePath: ./Dockerfile
    dockerContext: ./

    autoDeploy: true

    healthCheckPath: /healthz

    envVars:

      # Host
      - key: N8N_HOST
        sync: false

      - key: N8N_PROTOCOL
        value: https

      - key: N8N_PORT
        value: "5678"

      - key: WEBHOOK_URL
        sync: false

      - key: N8N_EDITOR_BASE_URL
        sync: false

      - key: APP_REFERER_URL
        sync: false

      # Database — Neon (external managed Postgres)
      # Only these two are needed. The Dockerfile's entrypoint.sh
      # parses DB_POSTGRESDB_CONNECTION_URL into the individual
      # DB_POSTGRESDB_HOST/PORT/DATABASE/USER/PASSWORD/SSL_ENABLED
      # vars that n8n actually reads, before n8n starts.
      # Fill the value in manually in the Render dashboard ->
      # Environment tab (see README) — do not commit real credentials.
      - key: DB_TYPE
        value: postgresdb

      - key: DB_POSTGRESDB_CONNECTION_URL
        sync: false

      # Security
      - key: N8N_ENCRYPTION_KEY
        sync: false

      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"

      - key: N8N_BASIC_AUTH_USER
        sync: false

      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false

      # Timezone
      - key: GENERIC_TIMEZONE
        value: Asia/Dhaka

      - key: TZ
        value: Asia/Dhaka

      # ---------------------------------------------------
      # Performance — 330MB total RAM budget
      # FIXED: this was previously "--max-old-space-size=256"
      # with no semi-space cap, which silently overrode the
      # Dockerfile's tighter 110/16 setting on every deploy
      # (Render env vars win over Dockerfile ENV of the same
      # name). That's the single biggest reason earlier RAM
      # tuning wasn't actually taking effect in production.
      # ---------------------------------------------------
      - key: NODE_OPTIONS
        value: --max-old-space-size=110 --max-semi-space-size=16

      - key: N8N_RUNNERS_ENABLED
        value: "false"

      - key: N8N_DEFAULT_BINARY_DATA_MODE
        value: filesystem

      - key: N8N_AVAILABLE_BINARY_DATA_MODES
        value: filesystem

      - key: N8N_BINARY_DATA_TTL
        value: "60"

      - key: N8N_CONCURRENCY_PRODUCTION_LIMIT
        value: "1"

      - key: OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS
        value: "false"

      - key: NODE_FUNCTION_ALLOW_BUILTIN
        value: fs

      - key: EXECUTIONS_TIMEOUT
        value: "3600"

      - key: N8N_PUBLIC_API_DISABLED
        value: "true"

      - key: N8N_METRICS
        value: "false"

      - key: UV_THREADPOOL_SIZE
        value: "2"

      # Cleanup
      # NOTE: kept at your original 24h/5000 rather than the 6h
      # I used in the Dockerfile default — with an external Neon
      # Postgres DB (not local SQLite), execution-data pruning is
      # about Neon storage/query speed, not Render container RAM,
      # so there's no RAM reason to prune more aggressively. Trim
      # these lower only if Neon storage or query latency becomes
      # a problem on its own.
      - key: N8N_PRUNING_ENABLED
        value: "true"

      - key: N8N_PRUNING_EXECUTION_DATA_MAX_AGE
        value: "24"

      - key: EXECUTIONS_DATA_PRUNE_MAX_COUNT
        value: "5000"

      # n8n instance behaviour
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"

      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"

      - key: N8N_TEMPLATES_ENABLED
        value: "false"

      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"

      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"

      - key: N8N_LOG_LEVEL
        value: warn

      - key: N8N_LOG_OUTPUT
        value: console

      # --- Workflow: AI script-generation keys ---
      - key: GEMINI_API_KEY
        sync: false

      - key: GOOGLE_API_KEY
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false

      - key: RENDER_AI_URL
        sync: false

      - key: RENDER_AI_API_KEY
        sync: false

      # --- Workflow: voice / TTS ---
      - key: ELEVENLABS_API_KEY
        sync: false

      - key: ELEVENLABS_VOICE_ID
        sync: false

      - key: EDGE_TTS_VOICE
        value: en-US-AndrewNeural

      - key: RENDER_TTS_URL
        sync: false

      - key: RENDER_TTS_API_KEY
        sync: false

      - key: RENDER_TTS_VOICE
        value: en-US-GuyNeural

      # --- Workflow: YouTube upload ---
      - key: YOUTUBE_DATA_API_KEY
        sync: false

      - key: YOUTUBE_CATEGORY_ID
        sync: false

      # --- Workflow: content / trends ---
      - key: CONTENT_CATEGORY
        sync: false

      - key: TRENDS_REGION
        value: US

      # --- Workflow: Google Sheet used as the topic/QC database ---
      - key: GOOGLE_SHEET_ID
        sync: false

      - key: GOOGLE_SHEET_TAB_USED_TOPICS
        value: UsedTopics

      - key: GOOGLE_SHEET_TAB_QC_LOG
        value: QC Log

      # --- Workflow: notifications ---
      - key: NOTIFY_EMAIL_SUCCESS
        sync: false

      - key: NOTIFY_EMAIL_ERROR
        sync: false

      - key: NOTIFY_WEBHOOK_URL
        sync: false
